<html>
<head>
    <title>Calorie Calculator</title>
    <style>

        .main-style {
            width: 65%;
            background-color: white;
            border: 3px solid #1616c7;
            border-radius: 20px;
            text-align: center;
            margin: 50px auto;
            padding: 0;
        }
        h1#title{
            background-color: #1616c7;
            color: white;
            padding: 15px;
            margin-top:0;
            border-radius:17px 17px 0 0;
        }
        .main-style p{
            font-size: 18px;
            font-family: Georgia, 'Times New Roman', Times, serif;
            width: 70%;
            margin: 25px auto;
        }
        .form{
            text-align: left;
            width: 70%;
            margin: 30px auto;
        }
        .form-group{
            margin-bottom: 15px;
        }
        .field-label{
            display: inline-block;
            background: rgb(74, 154, 192);
            padding: 4px;
            margin-bottom: 5px;
        }

        select:invalid{color: #999;}
        
        .form-group input[type="number"],
        .form-group select {
            width: 300px;
            padding: 8px;
        }
        
        .form-group input[type="radio"] { width: auto;}

        .button {
            padding: 10px 25px;
            display: block;
            margin: 20px auto;
        }
    </style>

</head>
<body>
    
    <div class="main-style">
        <h1 id="title">Calorie Calculator</h1>

        <p> Enter your information below to calculate 
            <br> your recommended daily calories </p>
          
        <form action="results.html" method="post" class="form">

            <div class="form-group">
                <label class="field-label">Gender:</label>
                <input type="radio" name="gender" value="male" required>
                <label>Male</label>
                <input type="radio" name="gender" value="female" required>
                <label>Female</label>
            </div>
            
            <div class="form-group">
                <label class="field-label" for="age"> Age </label>
                <input type="number" id="age"name="age"
                        min="1" max="120" 
                        placeholder="Enter your age" required>
            </div>

            <div class="form-group">
                <label class="field-label" for="weight"> Weight (kg):</label>
                <input type="number" id="weight" name="weight"
                        min="1" max="200"
                        placeholder="Enter your weight" required>
            </div>

            <div class="form-group">
                <label class="field-label" for="height">Height(cm):</label>
                <input type="number" id="height" name="height"
                        min="1" max="250"
                        placeholder="Enter your height" required>
            </div>

            <div class="form-group">
                <label class="field-label" for="level">Activity Level:</label>
                <select id="level" name="level" required>
                    <option value="" disabled selected>Enter your activity level (choose one):</option>
                    <option value="Sedentary">Sedentary (little or no exercise)</option>
                    <option value="Lightly">Lightly active (1-2 days/week)</option>
                    <option value="Moderately">Moderately active (3-5 days/week)</option>
                    <option value="Very">Very active (6-7 days/week)</option>
                    <option value="Extra">Extra active (intense daily training)</option>
                </select>
            </div>

            <div class="form-group">
                <label class="field-label" for="goal">Your Goal:</label>
                <select id="goal" name="goal" required>
                    <option value="" disabled selected>Enter your goal (choose one):</option>
                    <option value="Lose">Lose weight</option>
                    <option value="Maintain">Maintain weight</option>
                    <option value="Gain">Gain weight</option>
                </select>
            </div>

            <input class="button" type="submit" value="Calculate">
        </form>
    </div>
</body>
</html>
